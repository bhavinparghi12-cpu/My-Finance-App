name: my_finance_app
description: "A secure personal finance and investment management app."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  fl_chart: ^0.68.0
  http: ^1.2.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1

  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^10.0.0
  path_provider: ^2.1.3

  image_picker: ^1.1.2
  firebase_core: ^3.15.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700
